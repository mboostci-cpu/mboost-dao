services:
  cv-dao:
    build: .
    env_file: .env
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  cv-worker:
    build: .
    env_file: .env
    command: python worker.py
    volumes:
      - ./data:/app/data
    restart: unless-stopped
